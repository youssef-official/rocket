# ============================================================
# Nginx config for *.vivorax.online wildcard preview proxy
# ============================================================
# Place this file at: /etc/nginx/sites-available/vivorax-preview
# Then: sudo ln -s /etc/nginx/sites-available/vivorax-preview /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   1. Wildcard SSL certificate for *.vivorax.online
#      (use certbot with DNS challenge: see instructions below)
#   2. Node.js proxy server running on port 3456
#   3. DNS: *.vivorax.online → your server IP (A record)
# ============================================================

# Upstream: Node.js proxy server
upstream preview_proxy {
    server 127.0.0.1:3456;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name *.vivorax.online;
    return 301 https://$host$request_uri;
}

# HTTPS server block for all subdomains
server {
    listen 443 ssl http2;
    server_name *.vivorax.online;

    # === SSL Certificate (Wildcard) ===
    # Option 1: Let's Encrypt with Certbot DNS challenge
    #   sudo certbot certonly --manual --preferred-challenges dns \
    #     -d "*.vivorax.online" -d "vivorax.online"
    #
    # Option 2: Cloudflare Origin Certificate (if using Cloudflare for DNS)
    ssl_certificate     /etc/ssl/vivorax/fullchain.pem;
    ssl_certificate_key /etc/ssl/vivorax/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # Allow iframe embedding (for the editor preview)
    add_header Content-Security-Policy "frame-ancestors *" always;

    # Remove any upstream X-Frame-Options
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    # Proxy all HTTP requests to Node.js
    location / {
        proxy_pass http://preview_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Vite HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers * always;

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD";
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }
    }
}
